# Runtime copy is created at runtime/go2rtc.yaml.
# Use the local WebUI at http://127.0.0.1:1984 to add the Xiaomi account and camera.
# Name the selected camera stream: live
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: "127.0.0.1:8554"
webrtc:
  listen: "127.0.0.1:8555"
streams: {}
log:
  level: info
