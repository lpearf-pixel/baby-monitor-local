[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baby-monitor-local"
version = "0.1.0.dev0"
description = "Local-first baby monitor services for Intel macOS"
requires-python = ">=3.11"
dependencies = [
  "cryptography==48.0.1",
  "ctranslate2==4.8.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "fastapi>=0.116,<1",
  "faster-whisper==1.2.1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "openvino==2025.4.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "Pillow>=11.1,<13",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "services*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
